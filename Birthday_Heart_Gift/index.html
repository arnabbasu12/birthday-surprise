<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12020f">
  <title> Happy Birthday❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="page">
    <section class="intro" id="intro">
      <button id="startButton" class="gift" aria-label="উপহার খুলুন">
        <span class="ring r1"></span><span class="ring r2"></span>
        <span class="gift-heart">♥</span>
      </button>
      <h1>A little gift for you</h1>
      <p class="hint">Tap On this heart</p>
    </section>

    <section class="card hidden" id="card">
      <div class="photo">
        <div class="photo-ring"></div>
        <img src="assets/birthday-photo.jpg" alt="জন্মদিনের ছবি">
        <span class="orbit o1">♥</span><span class="orbit o2">✦</span><span class="orbit o3">♥</span>
      </div>
      <h2 class="title">Happy Birthday My S.P.B❤️</h2>
      <p class="wish">Always be happy, be succesfull, and always be mine.</p>
      <p class="wish">You are the happiness of my life.</p>
      <div class="sign">Endless love for you ♥</div>
      <button class="replay" id="replay">Back</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
